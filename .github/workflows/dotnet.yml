name: .NET 10 build and test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ApexPost_CI_Strong!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c '</dev/tcp/localhost/1433' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      APEXPOST_TEST_CONNECTION: "Server=localhost,1433;Database=master;User ID=sa;Password=ApexPost_CI_Strong!2026;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ApexPost.sln
      - name: Build
        run: dotnet build ApexPost.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ApexPost.sln --configuration Release --no-build --logger "console;verbosity=normal"
